name: Consumer tests

# Check 7 of the design. The scripts and the format reference in this
# repository are consumed as a submodule, so a change here is only ever
# exercised by the language packages that embed it. This builds one of them
# against the revision under review and runs its conformance runner, which
# is the test that reads the case files in tests/ and proves the language
# gives the same answer as the JavaScript reference in tools/.
#
# Written in the style of the same check in javascript-templates, at
# https://github.com/51Degrees/javascript-templates/blob/main/.github/workflows/consumer-tests.yml
#
# Only pipeline-dotnet is listed today because it is the first language to
# ship the element. A row is added for pipeline-node, pipeline-java,
# pipeline-python and the PHP package as each one lands.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schema/**'
      - '.github/workflows/consumer-tests.yml'
  workflow_dispatch:
    inputs:
      pipeline-dotnet-ref:
        description: Branch, tag or SHA of pipeline-dotnet to test against
        required: false
        default: main

permissions:
  contents: read

jobs:
  pipeline-dotnet:
    name: pipeline-dotnet derived property element
    runs-on: ubuntu-latest
    steps:
      - name: Check out the scripts under review
        uses: actions/checkout@v4
        with:
          path: derived

      - name: Check out pipeline-dotnet
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/pipeline-dotnet
          ref: ${{ inputs.pipeline-dotnet-ref || 'main' }}
          submodules: recursive
          path: consumer

      - name: Swap in the scripts and cases under review
        run: |
          set -euo pipefail
          dest=consumer/FiftyOne.Pipeline.Elements/FiftyOne.Pipeline.DerivedProperty/Scripts
          if [ ! -d "$dest" ]; then
            echo "::error::$dest is missing. The submodule has moved and this workflow needs updating."
            exit 1
          fi
          # The whole repository is copied rather than only scripts/,
          # because the conformance runner reads tests/ from the same
          # submodule and both sides have to move together.
          rm -rf "$dest/scripts" "$dest/tests"
          cp -r derived/scripts "$dest/scripts"
          cp -r derived/tests "$dest/tests"
          # A copy that changed nothing would run against the revision
          # pipeline-dotnet pins and report a pass that says nothing about
          # this pull request, so the difference is printed either way.
          if git -C "$dest" diff --quiet; then
            echo "::notice::identical to the revision pipeline-dotnet pins, nothing swapped in"
          else
            git -C "$dest" --no-pager diff --stat
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run the conformance runner only
        working-directory: consumer
        run: >
          dotnet test -c Release
          FiftyOne.Pipeline.Elements/FiftyOne.Pipeline.DerivedProperty.Tests/FiftyOne.Pipeline.DerivedPropertyTests.csproj
          --filter "FullyQualifiedName~ConformanceTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dotnet-results
          path: consumer/**/TestResults/*.trx
          if-no-files-found: warn
